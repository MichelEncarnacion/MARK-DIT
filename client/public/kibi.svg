<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 366" fill="none" role="img" aria-label="Kibi, robot mascota del DIT UPAEP">
  <defs>
    <linearGradient id="kg-head" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff5157"/>
      <stop offset="1" stop-color="#c50f16"/>
    </linearGradient>
    <linearGradient id="kg-red" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff4a51"/>
      <stop offset="1" stop-color="#bd0c13"/>
    </linearGradient>
    <linearGradient id="kg-screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9aa1a7"/>
      <stop offset="1" stop-color="#6b7378"/>
    </linearGradient>
    <radialGradient id="kg-ball" cx="0.4" cy="0.34" r="0.75">
      <stop offset="0" stop-color="#ffd2d4"/>
      <stop offset="0.35" stop-color="#ff5a60"/>
      <stop offset="1" stop-color="#c00d14"/>
    </radialGradient>
    <radialGradient id="kg-glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff2b33" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#ff2b33" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- sombra -->
  <ellipse cx="150" cy="346" rx="66" ry="11" fill="#000" opacity="0.45"/>

  <!-- resplandor de la antena -->
  <circle cx="150" cy="36" r="34" fill="url(#kg-glow)"/>
  <!-- antena -->
  <rect x="144" y="44" width="12" height="36" rx="6" fill="url(#kg-red)"/>
  <circle cx="150" cy="34" r="15" fill="url(#kg-ball)"/>
  <circle cx="145" cy="29" r="4" fill="#ffffff" opacity="0.85"/>

  <!-- brazos -->
  <path d="M96 238 Q72 272 88 312" stroke="url(#kg-red)" stroke-width="22" fill="none" stroke-linecap="round"/>
  <path d="M204 238 Q228 272 212 312" stroke="url(#kg-red)" stroke-width="22" fill="none" stroke-linecap="round"/>

  <!-- cuerpo en forma de U (profundidad + frente) -->
  <path d="M120 236 V292 Q120 320 152 320 Q184 320 184 292 V236"
        stroke="#8f0a10" stroke-width="32" fill="none" stroke-linecap="round" transform="translate(5,7)"/>
  <path d="M120 236 V292 Q120 320 152 320 Q184 320 184 292 V236"
        stroke="url(#kg-red)" stroke-width="32" fill="none" stroke-linecap="round"/>

  <!-- cabeza -->
  <rect x="68" y="72" width="164" height="132" rx="36" fill="url(#kg-head)"/>
  <!-- brillo glossy -->
  <rect x="82" y="82" width="138" height="40" rx="22" fill="#ffffff" opacity="0.13"/>
  <!-- marco de la pantalla -->
  <rect x="88" y="92" width="124" height="88" rx="24" fill="#c4ccd1"/>
  <!-- pantalla -->
  <rect x="96" y="100" width="108" height="72" rx="18" fill="url(#kg-screen)"/>

  <!-- ojos -->
  <rect x="120" y="120" width="20" height="28" rx="8" fill="#ffffff"/>
  <rect x="160" y="120" width="20" height="28" rx="8" fill="#ffffff"/>

  <!-- sonrisa con diente -->
  <path d="M131 151 L169 151 Q150 173 131 151 Z" fill="#ffffff"/>
  <rect x="148" y="151" width="4" height="7" fill="#7b8388"/>
</svg>
